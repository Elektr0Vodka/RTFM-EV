name: Publish Docker image

# Builds the container and pushes it to GitHub Container Registry (GHCR) on
# every push to main, so ghcr.io/<owner>/rtfm-ev:latest always tracks main.
# Each build is also tagged sha-<short> for pinning and rollback.
#
# No external secrets are required: GHCR login uses the built-in GITHUB_TOKEN.
# The package inherits the repository's visibility (public repo -> public image).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Only the newest main build matters for a rolling :latest, so cancel an
  # in-progress build when a newer commit lands.
  group: publish-docker
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the repository name, which GHCR requires.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
