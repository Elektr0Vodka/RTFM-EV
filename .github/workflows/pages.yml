name: Docs site

# Builds the GitHub Pages documentation site from README*.md and the in-app User
# Guide sources (frontend/src/content/manual/*.md). Nothing generated is committed:
# scripts/build/stage_pages_site.py stages the pages plus the shell in pages/, then
# the official Pages actions build them with Jekyll and deploy.
# Requires Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "README_ADVANCED.md"
      - "README_HA.md"
      - "frontend/src/content/manual/**"
      - "pages/**"
      - "scripts/build/stage_pages_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress deployment finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Stage site
        run: python3 scripts/build/stage_pages_site.py --out _pages_build/src

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_pages_build/src
          destination: ./_pages_build/site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_pages_build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
