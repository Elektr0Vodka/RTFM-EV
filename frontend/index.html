<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RTFM-EV" />
    <meta name="theme-color" content="#111419" />
    <meta name="description" content="Web interface for MeshCore mesh radio networks. Send and receive messages, manage contacts and channels, and configure your radio." />
    <title>RTFM-EV</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" href="./favicon-96x96.png" sizes="96x96" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" crossorigin="use-credentials" />
    <script>
      // Service worker registration moved to main.tsx (requires isSecureContext
      // for Web Push). Do not duplicate here.

      // Start critical data fetches before React/Vite JS loads.
      // Must be in <head> BEFORE the module script so the browser queues these
      // fetches before it discovers and starts downloading the JS bundle.
      // React hooks consume the promises via window.__prefetch.
      // These are the first requests of a page load, so this is the earliest
      // place a run-out reverse-proxy session shows (401, or a 403 that is not
      // the backend's own). Repeats src/utils/authRedirect.ts, which does not
      // exist yet at this point: same storage keys, same quiet period.
      var redirectingForLostSession = false;
      var redirectForLostSession = function() {
        if (redirectingForLostSession) return;
        var target = null;
        try {
          var last = Number(sessionStorage.getItem('remoteterm-auth-redirect-at'));
          if (last > 0 && Date.now() - last < 60000) return;
          sessionStorage.setItem('remoteterm-auth-redirect-at', String(Date.now()));
          target = safeRedirectTarget(localStorage.getItem('remoteterm-auth-redirect-url'));
        } catch {
          // Storage unavailable: fall through to a reload.
        }
        redirectingForLostSession = true;
        if (target) {
          window.location.assign(target);
        } else {
          window.location.reload();
        }
      };

      // Same rule as safeRedirectTarget in src/utils/authRedirect.ts: only a
      // path on this site or an http(s) address, rebuilt behind a literal
      // scheme so nothing else stored under the key can reach the navigation.
      var safeRedirectTarget = function(stored) {
        var trimmed = (stored || '').trim();
        if (!trimmed) return null;
        var isPath = trimmed.charAt(0) === '/' && trimmed.charAt(1) !== '/';
        if (!isPath && !/^https?:\/\//i.test(trimmed)) return null;
        // The query and fragment are percent-encoded once more; escapes that
        // are already there stay as they are.
        var encodePart = function(part) {
          return encodeURI(part).replace(/%25/g, '%').replace(/'/g, '%27');
        };
        var rest;
        var protocol;
        try {
          var parsed = new URL(trimmed, window.location.origin);
          protocol = parsed.protocol;
          rest = parsed.host + parsed.pathname + encodePart(parsed.search) + encodePart(parsed.hash);
        } catch {
          return null;
        }
        if (protocol === 'https:') return 'https://' + rest;
        if (protocol === 'http:') return 'http://' + rest;
        return null;
      };

      var fetchJsonOrThrow = function(url) {
        return fetch(url).then(function(response) {
          if (response.ok) {
            return response.json();
          }
          return response.text().then(function(rawError) {
            var message = rawError || response.statusText || ('HTTP ' + response.status);
            var ownAnswer = false;
            try {
              var parsed = JSON.parse(rawError);
              ownAnswer = !!parsed && typeof parsed === 'object' && 'detail' in parsed;
              if (parsed && typeof parsed.detail === 'string' && parsed.detail.length > 0) {
                message = parsed.detail;
              }
            } catch {
              // Keep raw text fallback when body is not JSON.
            }
            if (response.status === 401 || (response.status === 403 && !ownAnswer)) {
              redirectForLostSession();
            }
            throw new Error('Prefetch failed for ' + url + ': ' + message);
          });
        }).catch(function(err) {
          console.error(err);
          throw err;
        });
      };
      window.__prefetch = {
        config: fetchJsonOrThrow('./api/radio/config'),
        settings: fetchJsonOrThrow('./api/settings'),
        channels: fetchJsonOrThrow('./api/channels'),
        contacts: fetchJsonOrThrow('./api/contacts?limit=1000&offset=0'),
        unreads: fetchJsonOrThrow('./api/read-state/unreads'),
        undecryptedCount: fetchJsonOrThrow('./api/packets/undecrypted/count'),
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
